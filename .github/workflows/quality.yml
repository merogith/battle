name: Quality

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh symbol index
        run: node scripts/debug/symbol-index.mjs

      - name: Data integrity validation
        run: node scripts/debug/data-validator.mjs

      - name: Spec drift report
        run: node scripts/debug/spec-drift.mjs

        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Move audit
        run: npm run audit

      - name: Lint (in-scope files only — battle.html excluded)
        run: npm run lint

      - name: Verify release manifest and artifact
        run: npm run build:release

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            tests/reports/
            agent-state/ANCHOR_INDEX.md
          retention-days: 14
